name: Branch Validation

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate README exists
        run: test -f README.md

      - name: Validate dbt project exists
        run: test -f dbt_project.yml

      - name: Validate models folder exists
        run: test -d models

      - name: Validate documentation folder exists
        run: test -d documentation

      - name: Success
        run: echo "Repository validation successful."
