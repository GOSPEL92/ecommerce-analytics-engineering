version: 2

models:

  - name: dim_customer
    columns:

      - name: customer_id
        tests:
          - not_null
          - unique

  - name: dim_product
    columns:

      - name: stock_code
        tests:
          - not_null
          - unique

  - name: dim_date
    columns:

      - name: date_day
        tests:
          - not_null
          - unique

  - name: fct_sales
    columns:

      - name: invoice_no
        tests:
          - not_null

      - name: customer_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
              config:
                where: "customer_id <> ''"

      - name: stock_code
        tests:
          - not_null

          - relationships:
              arguments:
                to: ref('dim_product')
                field: stock_code

      - name: transaction_type
        tests:
          - not_null

          - accepted_values:
              arguments:
                values:
                  - Sale
                  - Customer Return
                  - Inventory Adjustment